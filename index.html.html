<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pocket Tales</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f2f5f8; --card:#ffffff; --ink:#14213a; --muted:#566379; --rule:#d3dbe6;
  --cobalt:#1d3f8f; --cobalt-soft:#e1e8f6; --on-cobalt:#ffffff;
  --mark:#f7da74; --mark-ink:#14213a;
  --tile-bg:#1d3f8f; --tile-line:#f2f5f8; --tile-dot:#f7da74;
  --serif:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1523; --card:#15203a; --ink:#e8edf6; --muted:#9fb0c8; --rule:#27355a;
    --cobalt:#8eaeff; --cobalt-soft:#1d2c52; --on-cobalt:#0d1523;
    --mark:#c99a1c; --mark-ink:#0d1523;
    --tile-bg:#1d2c52; --tile-line:#4a67b5; --tile-dot:#c99a1c;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 64px}

/* главная */
.site-bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--rule)}
.site-bar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(6px + env(safe-area-inset-top)) 20px 6px}
.logo{background:none;border:0;padding:8px 0;font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--ink);cursor:pointer}
.nav{display:flex;gap:18px}
.nav button{background:none;border:0;padding:8px 0;color:var(--muted);font-size:.92rem;cursor:pointer}
.tiles{
  height:56px;background-color:var(--tile-bg);
  background-image:
    radial-gradient(circle at 50% 50%, var(--tile-dot) 0 3px, transparent 3.5px),
    radial-gradient(circle at 0 0, transparent 0 11px, var(--tile-line) 11px 13px, transparent 13.5px),
    radial-gradient(circle at 100% 0, transparent 0 11px, var(--tile-line) 11px 13px, transparent 13.5px),
    radial-gradient(circle at 0 100%, transparent 0 11px, var(--tile-line) 11px 13px, transparent 13.5px),
    radial-gradient(circle at 100% 100%, transparent 0 11px, var(--tile-line) 11px 13px, transparent 13.5px);
  background-size:38px 38px;
}
.home{max-width:960px;margin:0 auto;padding:0 20px 56px}
.home h1,.home h2,.home h3{font-family:var(--serif);margin:0}
.hero{padding:36px 0 4px;max-width:640px}
.hero h1{font-size:2.6rem;line-height:1.05;letter-spacing:-.015em;margin-bottom:14px}
.lead{margin:0 0 22px;font-size:1.12rem;color:var(--muted);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--cobalt);color:var(--on-cobalt);border:1.5px solid var(--cobalt);border-radius:10px;padding:12px 20px;min-height:46px;font-size:1rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cobalt)}
.strip{margin:44px 0 0;background:var(--cobalt-soft);border-left:5px solid var(--cobalt);border-radius:0 14px 14px 0;padding:22px 22px 20px}
.strip h2{font-size:1.45rem;margin-bottom:8px}
.strip > p{margin:0 0 16px;max-width:60ch}
.cols{display:grid;gap:16px}
.col h3{font-size:1rem;margin-bottom:6px;color:var(--cobalt)}
.col ul{margin:0;padding-left:1.1rem}
.col li{margin:0 0 3px}
.sec{margin:60px 0 0;scroll-margin-top:64px}
.sec-h{font-size:1.6rem;margin-bottom:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.steps li{display:flex;gap:16px;align-items:flex-start}
.sn{flex:none;width:40px;height:40px;border:2px solid var(--cobalt);border-radius:7px;background:var(--cobalt-soft);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--cobalt)}
.steps h3{font-size:1.12rem;margin:6px 0 4px}
.steps p{margin:0 0 8px;max-width:58ch}
.demo{display:inline-block;margin:6px 0 4px !important;padding:12px 16px;background:var(--card);border:1px solid var(--rule);border-radius:10px;font-size:1.3rem !important;line-height:1.6 !important}
.demo-note{color:var(--muted);font-size:.9rem}
.bub{display:inline-flex;vertical-align:-.2em;color:var(--cobalt)}
.sec-lead{margin:-6px 0 18px;color:var(--muted);max-width:56ch}
.whys{max-width:720px;border-top:1px solid var(--rule)}
.why-i{padding:16px 2px 18px;border-bottom:1px solid var(--rule)}
.why-i h3{font-size:1.12rem;margin-bottom:4px}
.why-i p{margin:0;color:var(--muted);max-width:60ch}
.eps{border-top:1px solid var(--rule)}
.ep{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 2px;cursor:pointer}
.ep:active{background:var(--cobalt-soft)}
.num{flex:none;width:40px;height:40px;border:2px solid var(--cobalt);border-radius:7px;background:var(--cobalt-soft);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--cobalt)}
.ep-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ep-t b{font-family:var(--serif);font-size:1.08rem}
.ep-t small{color:var(--muted);font-size:.9rem}
.ep-k{flex:none;color:var(--muted);font-size:.82rem;text-align:right;max-width:5.2em}
.proto{margin:14px 0 0;color:var(--muted);font-size:.88rem}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:.88rem}
@media (min-width:760px){
  .hero{padding-top:56px}
  .hero h1{font-size:3.2rem}
  .cols{grid-template-columns:1fr 1fr}
}

/* серия */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--rule);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.back{background:none;border:0;color:var(--cobalt);font-size:1rem;padding:8px;min-height:40px;cursor:pointer}
.bar-t{color:var(--muted);font-size:.9rem;padding-right:8px}
.ep-title{font-family:var(--serif);font-size:1.95rem;line-height:1.12;letter-spacing:-.01em;margin:24px 0 4px}
.ep-sub{margin:0 0 18px;color:var(--muted)}
.ctl{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.hint{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.switch{display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{flex:none;width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + i{background:var(--cobalt)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:3px solid var(--cobalt);outline-offset:2px}

.blk{margin:0 0 6px}
.es{font-family:var(--serif);font-size:clamp(1.18rem,4.8vw,1.4rem);line-height:1.8;margin:0 0 .5em}
.es.dlg{margin-bottom:.3em;padding-left:.2em}
.blk > .es:last-of-type{margin-bottom:0}
.blk{padding-bottom:1.5em}
.w{border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.w:active{background:var(--cobalt-soft)}
.w.k1{background:var(--mark);color:var(--mark-ink);padding:0 3px;margin:0 -1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.k2{text-decoration:underline dashed var(--cobalt);text-decoration-thickness:2px;text-underline-offset:5px}
.w.demo{cursor:default;font-family:var(--serif);font-size:1.05rem}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:8px;vertical-align:-.3em;border:1.5px solid var(--rule);border-radius:50%;background:none;color:var(--muted);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.tbtn:active{background:var(--cobalt-soft);color:var(--cobalt);border-color:var(--cobalt)}
.bub{display:inline-flex;vertical-align:-.2em;color:var(--cobalt)}
.tr{display:none;margin:12px 0 0;padding:6px 0 6px 12px;border-left:3px solid var(--rule);color:var(--muted);font-size:.98rem;line-height:1.55}
.tr div{margin:0 0 4px}
.show-all .tr{display:block}
.pic{margin:4px 0 26px}
.pic img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--rule)}
.pl{margin:0 0 14px}
.pl-es{font-family:var(--serif);font-size:1.06rem;line-height:1.5}
.pl-ru{color:var(--muted);font-size:.98rem;line-height:1.5;margin-top:2px}
.sh-word.sm{font-size:1.3rem}

.keys{margin-top:36px;padding-top:20px;border-top:1px solid var(--rule)}
.keys h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 12px}
.keys-note{margin:12px 0 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px}
.chip b{font-family:var(--serif);font-size:1.02rem}
.chip span{color:var(--muted);font-size:.85rem}
.chip.done{border-color:var(--cobalt)}
.chip.done b::after{content:" ✓";color:var(--cobalt)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:32px}
.pg{background:var(--card);border:1.5px solid var(--cobalt);color:var(--cobalt);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.pg.next{background:var(--cobalt);color:var(--on-cobalt)}

/* карточка слова */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;z-index:30;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.22);padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:74vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:2px auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-word{font-family:var(--serif);font-size:1.75rem;line-height:1.15;font-weight:700}
.badge{display:inline-block;margin-top:8px;font-size:.8rem;padding:3px 10px;border-radius:999px}
.b1{background:var(--mark);color:var(--mark-ink)}
.b2{background:var(--cobalt-soft);color:var(--cobalt)}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:1.9rem;line-height:1;width:40px;height:40px;cursor:pointer}
.sh-ru{font-size:1.2rem;margin:10px 0 4px}
.lemma{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.note{margin:16px 0 4px;background:var(--cobalt-soft);border-left:4px solid var(--cobalt);border-radius:0 10px 10px 0;padding:12px 14px}
.note h3{font-family:var(--serif);font-size:1.02rem;margin:0 0 6px}
.note p{margin:0 0 8px;font-size:.98rem;line-height:1.55}
.note p:last-child{margin-bottom:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.act{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--cobalt);color:var(--cobalt);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.act.on{background:var(--cobalt);color:var(--on-cobalt)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:.92rem;line-height:1.45;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="scrim" class="scrim"></div>
<aside id="sheet" class="sheet" aria-live="polite"></aside>
<script>
const START_PAIR = ['ru', 'de'];
// Реестр языков. Три независимых слоя данных:
//  LANG_UI[l1]            — интерфейс и общие тексты сайта на языке читателя
//  LANG_TARGETS[target]   — истории и слова на изучаемом языке (не зависят от родного)
//  LANG_PAIRS['l1-target'] — переводы, подсказки и пояснения под конкретную пару языков
const LANG_UI = {};
const LANG_TARGETS = {};
const LANG_PAIRS = {};

// собирает всё нужное приложению для выбранной пары
function buildContent(l1, target){
  const T = LANG_TARGETS[target], P = LANG_PAIRS[l1 + '-' + target], UIx = LANG_UI[l1];
  if (!T || !P || !UIx) throw new Error('Нет данных для пары ' + l1 + '-' + target);
  const EPISODES = T.stories.map(s => ({
    n: s.n, title: s.title, titleL1: P.stories[s.n].title, keys: s.keys,
    lines: s.lines.map((l, i) => [l, P.stories[s.n].lines[i]])
  }));
  const D = {};
  for (const f in T.forms){ const x = T.forms[f]; D[f] = [P.forms[f] || '', x[0] || '', x[1] || '', x[2] || '']; }
  const PHRASES = T.phrases.map(p => [p[0], P.phrases[p[0]] || '', p[1] || '', p[2] || '']);
  const KEYS = {};
  for (const k in T.keyLabels) KEYS[k] = [T.keyLabels[k], P.keys[k] || ''];
  const BLOCKS = {}, PICS = {};
  T.stories.forEach(s => {
    BLOCKS[s.n] = s.blocks;
    if (s.pic) PICS[s.n] = { after: s.pic.after, alt: (P.picAlt && P.picAlt[s.n]) || '' };
  });
  return { l1, target, UI: UIx, T, EPISODES, D, PHRASES, KEYS, NOTES: P.notes, BLOCKS, PICS };
}

// проверка: чего не хватает в паре языков (пригодится при добавлении новых пар)
function checkPair(l1, target){
  const T = LANG_TARGETS[target], P = LANG_PAIRS[l1 + '-' + target], miss = [];
  T.stories.forEach(s => {
    const ps = P.stories[s.n];
    if (!ps || !ps.title) miss.push('заголовок серии ' + s.n);
    s.lines.forEach((l, i) => { if (!ps || !ps.lines[i]) miss.push('серия ' + s.n + ', строка ' + (i + 1)); });
  });
  for (const f in T.forms) if (!P.forms[f]) miss.push('слово: ' + f);
  T.phrases.forEach(p => { if (!P.phrases[p[0]]) miss.push('фраза: ' + p[0]); });
  for (const k in T.keyLabels) if (!P.keys[k]) miss.push('ключевое слово: ' + k);
  for (const f in T.forms){ const n = T.forms[f][2]; if (n && !P.notes[n]) miss.push('пояснение: ' + n); }
  return miss;
}
if (typeof module !== 'undefined') module.exports = { LANG_UI, LANG_TARGETS, LANG_PAIRS, buildContent, checkPair };

// Интерфейс и общие тексты сайта на русском (для русскоговорящих читателей).
LANG_UI.ru = {
  code: 'ru',
  siteName: 'Pocket Tales',
  inL1: 'на русском',
  // то, что зависит от изучаемого языка
  targets: {
    de: {
      onTarget: 'на немецком',
      ofTarget: 'немецкого',
      whyExtra: [
        ['Объяснения для русскоговорящих', 'Хитрые места немецкого (<i>es gibt</i>, <i>weil</i>, <i>nichts</i>, артикли) объясняются по-русски, так, как их проще понять нам.'],
        ['Немецкий без паники', 'Порядок слов, падежи и отделяемые приставки появляются постепенно, по одному примеру из живого текста, а не стеной правил.']
      ]
    },
    es: {
      onTarget: 'на испанском',
      ofTarget: 'испанского',
      whyExtra: [
        ['Объяснения для русскоговорящих', 'Хитрые слова (<i>hay</i>, <i>voy a</i>, <i>porque</i>) объясняются по-русски, без отсылок к английскому: так, как их проще понять нам.'],
        ['Испанский Испании', 'Слова и выражения из повседневной жизни в Испании: <i>piso</i>, <i>portal</i>, <i>vale</i>. Не латиноамериканский вариант.']
      ]
    }
  },
  nav: { why: 'Суть', how: 'Как это работает', eps: 'Серии' },
  hero: {
    lead: 'Читай короткие истории {onTarget}: одну, две или больше в день. Пополняй словарный запас, привыкай к чтению и бери из каждой истории пользу. Уровень {level}, с переводом и пояснениями {inL1}.',
    start: 'Начать с серии 1',
    how: 'Как это работает'
  },
  why: {
    h: 'Почему именно такой формат',
    lead: 'Суть в одном предложении: короткие истории, мало новых слов и много повторов.',
    items: [
      ['Истории короткие', '3–5 минут: их реально дочитать, а не бросить на второй странице. Читай одну, две или больше за раз, как удобно: короткая история легко вписывается в любой день.'],
      ['Новых слов немного', 'В каждой серии 6–9 ключевых слов. Всё остальное понятно из контекста или по тапу, поэтому текст не превращается в расшифровку кода.'],
      ['Слова повторяются', 'Ключевое слово из первой серии возвращается в следующих, поэтому запоминается само, без зубрёжки и карточек.'],
      ['Один сюжет на все серии', 'Истории связаны между собой, и хочется узнать, что будет дальше. Поэтому возвращаешься каждый день.']
    ]
  },
  strip: {
    h: 'Важно: это не полный курс',
    p: 'Это один из дополняющих методов: он помогает легко и удобно пополнять словарный запас и учиться читать. По ходу чтения будут пояснения: по грамматике и не только.',
    helpsH: 'Помогает',
    helps: ['пополнять словарь без зубрёжки', 'привыкать к чтению на изучаемом языке', 'видеть слова и грамматику в живом тексте'],
    notH: 'Не заменяет',
    not: ['уроки и учебник', 'разговорную практику', 'письмо и упражнения']
  },
  how: {
    h: 'Как это работает',
    steps: [
      { h: 'Читай, сколько удобно', p: 'Одна история, две или больше за раз: каждая занимает 3–5 минут. Сначала попробуй понять сам, без перевода.' },
      { h: 'Нажимай на слова', p: 'Появятся перевод, начальная форма и, если слово хитрое, пояснение на русском. Попробуй прямо здесь:',
        demo: true, note: 'Жёлтым выделены ключевые слова серии. Слова, которые ты уже учил в прошлых сериях, подчёркиваются пунктиром.' },
      { h: 'Проси подсказку по абзацу', p: 'Значок {bub} в конце абзаца открывает его перевод и озвучку. Если нужен весь перевод сразу, включи переключатель наверху серии.' },
      { h: 'Повтори ключевые слова', p: 'В конце серии они собраны списком. Они вернутся в следующих историях, и так запомнятся сами.' }
    ]
  },
  eps: {
    h: 'Серии',
    words: n => { const m = n % 10, c = n % 100; return n + ' ' + (m === 1 && c !== 11 ? 'слово' : (m >= 2 && m <= 4 && (c < 12 || c > 14) ? 'слова' : 'слов')); },
    proto: n => 'Прототип: серий ' + n + ', тексты пробные.'
  },
  footer: 'Pocket Tales · короткие истории для изучения языка',
  episode: {

const WORD_RE = /\p{L}+/u;
function tokenize(text, D, PHRASES){
  const parts = text.match(/\p{L}+|[^\p{L}]+/gu) || [];
  const out = [];
  for (let i=0;i<parts.length;i++){
    const p = parts[i];
    if (!WORD_RE.test(p)){ out.push({t:p}); continue; }
    let matched = null;
    for (const ph of PHRASES){
      const words = ph[0].split(' ');
      let j=i, ok=true, text2='';
      for (let k=0;k<words.length;k++){
        const w = parts[j];
        if (!w || w.toLowerCase()!==words[k]){ ok=false; break; }
        text2 += w;
        j++;
        if (k<words.length-1){
          const sep = parts[j];
          if (!sep || !/^\s+$/.test(sep)){ ok=false; break; }
          text2 += sep; j++;
        }
      }
      if (ok){ matched={ph, end:j, text:text2}; break; }
    }
    if (matched){
      out.push({t:matched.text, phrase:matched.ph});
      i = matched.end-1;
    } else {
      out.push({t:p, entry:D[p.toLowerCase()]||null, form:p.toLowerCase()});
    }
  }
  return out;
}

/* ---------- озвучка: выбираем голос нужного языка явно ---------- */
let _voices = [];
function loadVoices(){ if (!CAN_SPEAK) return; try { _voices = speechSynthesis.getVoices() || []; } catch(e) {} }
if (CAN_SPEAK){
  loadVoices();
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); }
  catch(e) { try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e2) {} }
}
function pickVoice(lang){
  const base = lang.split('-')[0].toLowerCase();
  const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
  const cands = _voices.filter(v => norm(v).split('-')[0] === base);
  if (!cands.length) return null;
  const score = v => (norm(v) === lang.toLowerCase() ? 4 : 0)
    + (/premium|enhanced|erweitert|mejorad|улучш/i.test(v.name || '') ? 2 : 0)
    + (v.localService ? 1 : 0);
  return cands.slice().sort((x, y) => score(y) - score(x))[0];
}
let _toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.classList.remove('show'), 9000);
}
function speak(text){
  if (!CAN_SPEAK) return;
  try {
    if (!_voices.length) loadVoices();
    const v = pickVoice(TGT.ttsLang);
    const u = new SpeechSynthesisUtterance(text.replace(/[«»—„“]/g,' '));
    u.lang = TGT.ttsLang; u.rate = 0.85;
    if (v) u.voice = v;
    else if (_voices.length) showToast(fill(UI.sheet.noVoice, { ofTarget: UI.targets[TGT.code].ofTarget }));
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e) {}
}

/* ---------- главная ---------- */
function renderHome(){
  S.view = 'home'; S.ep = 1; S.reg = [];
  const tInfo = UI.targets[TGT.code];
  const demo = tokensHtml(TGT.demo);
  const rows = EPISODES.map(e => `
    <button class="ep" data-ep="${e.n}">
      <span class="num">${e.n}</span>
      <span class="ep-t"><b>${esc(e.title)}</b><small>${esc(e.titleL1)}</small></span>
      <span class="ep-k">${UI.eps.words(e.keys.length)}</span>
    </button>`).join('');
  const why = UI.why.items.concat(tInfo.whyExtra || [])
    .map(w => `<div class="why-i"><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('');
  const steps = UI.how.steps.map((s, i) => `
    <li><span class="sn">${i+1}</span><div><h3>${s.h}</h3><p>${fill(s.p, {bub: BUB})}</p>
      ${s.demo ? `<p class="demo es">${demo}</p><p class="demo-note">${s.note}</p>` : ''}</div></li>`).join('');
  const lead = fill(UI.hero.lead, { onTarget: tInfo.onTarget, level: TGT.level, inL1: UI.inL1 });
  $app.innerHTML = `
  <div class="site-bar"><div class="site-bar-in">
    <button class="logo" data-go="top">${UI.siteName}</button>
    <nav class="nav"><button data-go="why">${UI.nav.why}</button><button data-go="how">${UI.nav.how}</button><button data-go="eps">${UI.nav.eps}</button></nav>
  </div></div>
  <div class="tiles" aria-hidden="true"></div>
  <main class="home" id="top">
    <header class="hero">
      <h1>${UI.siteName}</h1>
      <p class="lead">${lead}</p>
      <div class="cta"><button class="btn" data-ep="1">${UI.hero.start}</button><button class="btn ghost" data-go="how">${UI.hero.how}</button></div>
    </header>

    <section class="sec" id="why">
      <h2 class="sec-h">${UI.why.h}</h2>
      <p class="sec-lead">${UI.why.lead}</p>
      <div class="whys">${why}</div>
    </section>

    <section class="strip">
      <h2>${UI.strip.h}</h2>
      <p>${UI.strip.p}</p>
      <div class="cols">
        <div class="col"><h3>${UI.strip.helpsH}</h3><ul>${UI.strip.helps.map(x => `<li>${x}</li>`).join('')}</ul></div>
        <div class="col"><h3>${UI.strip.notH}</h3><ul>${UI.strip.not.map(x => `<li>${x}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="sec" id="how">
      <h2 class="sec-h">${UI.how.h}</h2>
      <ol class="steps">${steps}</ol>
    </section>

    <section class="sec" id="eps">
      <h2 class="sec-h">${UI.eps.h}</h2>
      <div class="eps">${rows}</div>
      <p class="proto">${UI.eps.proto(EPISODES.length)}</p>
    </section>

    <footer class="foot">${UI.footer}</footer>
  </main>`;
  window.scrollTo(0,0);
}

/* ---------- серия ---------- */
function tokensHtml(text){
  return tokenize(text, D, PHRASES).map(t => {
    if (!t.phrase && !t.entry) return esc(t.t);
    const keyId = t.phrase ? t.phrase[2] : t.entry[2];
    let cls = 'w';
    if (keyId){
      const intro = firstEp[keyId];
      if (intro === S.ep) cls += ' k1'; else if (intro < S.ep) cls += ' k2';
    }
    S.reg.push(t);
    return `<span class="${cls}" role="button" tabindex="0" data-ti="${S.reg.length-1}">${esc(t.t)}</span>`;
  }).join('');
}

function renderEpisode(n){
  const e = EPISODES.find(x => x.n === n);
  S.view = 'ep'; S.ep = n; S.reg = []; S.blocks = [];

  const ranges = BLOCKS[n] || [[0, e.lines.length-1]];
  const body = ranges.map((rng, bi) => {
    const ls = e.lines.slice(rng[0], rng[1]+1);
    S.blocks.push({ es: ls.map(l => l[0]), ru: ls.map(l => l[1]) });

    const paras = []; let buf = [];
    const flush = () => { if (buf.length){ paras.push({html:buf.join(' '), dlg:false}); buf = []; } };
    ls.forEach(l => {
      const h = tokensHtml(l[0]);
      if (l[0].startsWith('—')){ flush(); paras.push({html:h, dlg:true}); } else buf.push(h);
    });
    flush();

    const btn = `<button class="tbtn" data-bp="${bi}" aria-label="${UI.episode.paraAria}">${ICON_BUBBLE}</button>`;
    const ps = paras.map((p, i) => `<p class="es${p.dlg?' dlg':''}">${p.html}${i===paras.length-1?btn:''}</p>`).join('');
    const tr = ls.map(l => `<div>${esc(l[1])}</div>`).join('');

    let pic = '';
    const pc = PICS[n];
    if (pc && pc.after === bi && typeof IMAGE_DATA !== 'undefined' && IMAGE_DATA[n]){
      pic = `<figure class="pic"><img src="${IMAGE_DATA[n]}" alt="${esc(pc.alt)}"></figure>`;
    }
    return `<section class="blk">${ps}<div class="tr">${tr}</div></section>${pic}`;
  }).join('');

  const chips = e.keys.map(k => `
    <button class="chip${S.learned.has(k)?' done':''}" data-key="${k}">
      <b>${esc(KEYS[k][0])}</b><span>${esc(KEYS[k][1])}</span>
    </button>`).join('');

  const prev = EPISODES.find(x => x.n === n-1), next = EPISODES.find(x => x.n === n+1);
  const E = UI.episode;
  $app.innerHTML = `
  <div class="bar">
    <button class="back" data-act="home">${E.back}</button>
    <span class="bar-t">${E.barTitle(n, EPISODES.length)}</span>
  </div>
  <main class="wrap story${S.showAll?' show-all':''}">
    <h1 class="ep-title">${esc(e.title)}</h1>
    <p class="ep-sub">${esc(e.titleL1)}</p>
    <div class="ctl">
      <label class="switch"><input type="checkbox" id="showAll"${S.showAll?' checked':''}><i></i><span>${E.showAll}</span></label>
      <p class="hint">${fill(E.hint, {bub: BUB})}</p>
    </div>
    ${body}
    <section class="keys">
      <h2>${E.keysH}</h2>
      <div class="chips">${chips}</div>
      ${n>1 ? `<p class="keys-note">${E.keysNote}</p>` : ''}
    </section>
    <nav class="pager">
      ${prev ? `<button class="pg" data-ep="${prev.n}">${E.prev(prev.n)}</button>` : '<span></span>'}
      ${next ? `<button class="pg next" data-ep="${next.n}">${E.next(next.n)}</button>` : `<button class="pg next" data-act="home">${E.toList}</button>`}
    </nav>
  </main>`;
  window.scrollTo(0,0);
}

/* ---------- карточки ---------- */
let current = null;
function showSheet(){ $sheet.classList.add('open'); $scrim.classList.add('open'); $sheet.scrollTop = 0; }
function closeSheet(){ $sheet.classList.remove('open'); $scrim.classList.remove('open'); current = null; }

function openSheet(info){
  current = info;
  const cur = S.ep, SH = UI.sheet;
  let badge = '';
  if (info.key){
    const intro = firstEp[info.key];
    if (intro === cur) badge = `<span class="badge b1">${SH.keyThis}</span>`;
    else if (intro < cur) badge = `<span class="badge b2">${SH.repeatFrom(intro)}</span>`;
    else badge = `<span class="badge b2">${SH.keyOf(intro)}</span>`;
  }
  const note = info.note && NOTES[info.note]
    ? `<div class="note"><h3>${NOTES[info.note][0]}</h3>${NOTES[info.note][1].map(p=>`<p>${p}</p>`).join('')}</div>` : '';
  const lemma = info.lemma ? `<p class="lemma">${SH.lemma}: <i>${esc(info.lemma)}</i></p>` : '';
  const learned = info.key ? `<button class="act${S.learned.has(info.key)?' on':''}" data-act="learn">${S.learned.has(info.key)?SH.learned:SH.learn}</button>` : '';
  $sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sh-top">
      <div><div class="sh-word">${esc(info.text)}</div>${badge}</div>
      <button class="x" data-act="close" aria-label="${SH.close}">×</button>
    </div>
    <div class="sh-ru">${esc(info.ru)}</div>
    ${lemma}${note}
    <div class="acts">${CAN_SPEAK?`<button class="act" data-act="word-say">${ICON_SPEAK}<span>${SH.say}</span></button>`:''}${learned}</div>`;
  showSheet();
}

function openPara(bi){
  const b = S.blocks[bi], SH = UI.sheet;
  current = { say: b.es.join(' ') };
  $sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sh-top">
      <div class="sh-word sm">${SH.paraTitle}</div>
      <button class="x" data-act="close" aria-label="${SH.close}">×</button>
    </div>
    ${b.es.map((s,i) => `<div class="pl"><div class="pl-es">${esc(s)}</div><div class="pl-ru">${esc(b.ru[i])}</div></div>`).join('')}
    <div class="acts">${CAN_SPEAK?`<button class="act" data-act="word-say">${ICON_SPEAK}<span>${SH.paraSay}</span></button>`:''}</div>`;
  showSheet();
}

function infoFromToken(t){
  if (t.phrase) return {text:t.t, ru:t.phrase[1], lemma:'', key:t.phrase[2], note:t.phrase[3], say:t.t};
  const en = t.entry;
  return {text:t.t, ru:en[0], lemma:en[1] && en[1].toLowerCase()!==t.form ? en[1] : '', key:en[2], note:en[3], say:t.t};
}

/* ---------- события ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-ti],[data-bp],[data-act],[data-ep],[data-key],[data-go]');
  if (!el) return;
  if (el.dataset.go){ const t = document.getElementById(el.dataset.go); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if (el.dataset.ti !== undefined){ openSheet(infoFromToken(S.reg[+el.dataset.ti])); return; }
  if (el.dataset.bp !== undefined){ openPara(+el.dataset.bp); return; }
  if (el.dataset.key){
    const k = el.dataset.key;
    openSheet({text:KEYS[k][0], ru:KEYS[k][1], lemma:'', key:k, note:NOTES[k]?k:'', say:KEYS[k][0].split(' ')[0]});
    return;
  }
  if (el.dataset.ep){ closeSheet(); renderEpisode(+el.dataset.ep); return; }
  const act = el.dataset.act;
  if (act === 'home'){ closeSheet(); renderHome(); }
  else if (act === 'close'){ closeSheet(); }
  else if (act === 'word-say' && current){ speak(current.say); }
  else if (act === 'learn' && current && current.key){
    if (S.learned.has(current.key)) S.learned.delete(current.key); else S.learned.add(current.key);
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('done', S.learned.has(c.dataset.key)));
    openSheet(current);
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'showAll'){
    S.showAll = ev.target.checked;
    document.querySelector('.story').classList.toggle('show-all', S.showAll);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.w')){ ev.preventDefault(); ev.target.click(); }
});
$scrim.addEventListener('click', closeSheet);

renderHome();

</script>
